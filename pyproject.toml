[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-leakage-quarantine-filter"
version = "0.1.0"
description = "Real-time output scanner identifying and quarantining accidental leaks of system prompts, inner thoughts, or confidential rules"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
prompt-leakage-quarantine-filter = "prompt_leakage_quarantine_filter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prompt_leakage_quarantine_filter*"]
